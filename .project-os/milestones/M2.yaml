id: M2
name: Core Prototype and Playtest
status: done
objective: >-
  Expand the proven loop through T04 so players test visual, data, behavior, and
  conditional defects, then validate the core experience with human playtesting.
entry_criteria:
  - M1 is complete with its verification evidence.
exit_criteria:
  - T02, T03, and T04 are playable through the full QA loop.
  - Account Switcher unlocks for T04 and obeys Scenario policy.
  - Conditional mutation positive and negative cases are automated.
  - A human decides whether the core loop is ready for broad content production.
rebaseline: >-
  DEC-016 records the project owner's direction to produce content and to proceed with
  M3 and M4 as the content-scaling decision. The human playtest (TASK-010) moved to M4,
  where it is the final Human Gate for the whole game.
tasks:
  - TASK-007
  - TASK-008
  - TASK-009
human_gate:
  required_on_completion: true
  reason: >-
    Enjoyment, product believability, and readiness for content scaling are subjective
    product judgments that cannot be approved by automated checks alone.
  resolved_by: .project-os/decisions/DEC-016-milestone-rebaseline.yaml
