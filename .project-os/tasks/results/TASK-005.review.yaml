  progression_and_persistence:
    status: pass
    evidence:
    - A valid Review transitions TESTING through REPORTED and REVIEWED to RESOLVED,
      updates XP, level, Reputation, histories, and unlocks in one parsed Game State.
    - Reapplying the same Report id returns the existing state, preventing duplicate
      rewards.
    - Chromium verifies Dashboard resolution and XP survive a browser reload.
  architecture_and_scope:
    status: pass
