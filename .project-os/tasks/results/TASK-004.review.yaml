acceptance:
  workspace_hierarchy:
    status: pass
    evidence:
    - Shoply occupies the dominant workspace region inside light Fake Browser chrome.
    - The dark QA Toolbar and inspector remain visually distinct from Product UI.
  router_isolation:
    status: pass
    evidence:
    - ProductNavigationProvider owns in-memory Product transitions inside Fake Browser.
    - Chromium confirms Product, Cart, and Checkout navigation while the Main Game
      URL stays /test/T01.
    - No iframe, external site access, or popup API is present.
  viewport_behavior:
    status: pass
    evidence:
    - Desktop fills the browser stage and Tablet/Mobile set the Product container
      to 768px/390px.
    - Container queries reflow Shoply at narrow Product widths independently of the
      host window width.
  notes:
    status: pass
    evidence:
    - Notes auto-save by Ticket in a versioned nothingwrong.workspace envelope.
    - Notes are absent from nothingwrong.gameState and therefore cannot affect Review
      input.
  evidence_capture:
    status: pass
    evidence:
    - Captures include ticketId, path, viewport, account, locale, timestamp, semantic
      snapshot, and preview.
    - The inspector renders a visible preview with page heading, viewport, capture
      time, and path.
  interaction_history:
    status: pass
    evidence:
    - OPEN_PRODUCT, ADD_TO_CART, OPEN_CART, CHANGE_QUANTITY, OPEN_CHECKOUT, and CAPTURE_EVIDENCE
      are persisted for T01.
    - Account switching and Report submission remain outside TASK-004 scope.
  architecture_and_scope:
    status: pass
    evidence:
    - Product components contain no Ticket ID, T01, or ExpectedBug behavior switch.
    - localStorage access remains behind persistence adapters.
    - T01 Mutation, scoring, progression, and final Report submission remain deferred
      to TASK-005.
