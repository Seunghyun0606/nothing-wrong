summary: TASK-004 satisfies the Test Workspace and Evidence-flow contract. The implementation
  keeps Product navigation local to Fake Browser, preserves Shoply's normal behavior,
  persists Notes outside reviewable Game State, captures complete Evidence, and records
  the T01 journey without introducing T01-specific Product branches.
