residual_risk: The term test only blocks known variants, so new strings can bring
  in new wordings. The Note/record overlap may confuse playtest participants in Korean
  and should be decided before the TASK-010 session. About 292 dead ko.json keys remain.
  The playtest kit has not yet been run by a person against the Godot build, and the
  session template's day boundaries (clock-out after T02) need correcting before use.
