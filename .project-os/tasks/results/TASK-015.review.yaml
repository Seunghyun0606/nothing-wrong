      (''Tests: N passed'', run_tests.gd:40), import typecheck, `--export-release
      "Windows Desktop" build/windows/NothingWrong.exe` (export_presets.cfg:3,12),
      `--headless --quit-after 3000 -- --self-check` (''Self-check passed'', self_check.gd:84),
      and projectctl doctor.'
    - Screenshot tour arguments `<out> [en|ko] [WxH]` match screenshot_tour.gd. Save
      names, including save.unreadable.json, match game_session.gd, workspace_session.gd,
      and settings.gd.
    - 'The participant guide''s controls exist in the game: Start work, Sign in, Arrange
      (화면 정렬), Start test, ''Stuck? Ask %s for a hint'', 📌 Note, Clock out, New game.
      The full-story coverage claims (T01-T42, the 7 NO ISSUE FOUND Tickets, T11 two
      defects, the ending) match test_full_story.'
    - npm, Vite, localStorage, and port 4173 appear only under 'Frozen web build (reference
      only)' (TESTING.md:52-55).
  key_terms_one_korean_translation_tested:
    status: pass
    evidence:
    - test_key_terms_have_one_korean_wording loops over all ko.json values (1578)
      against the deny list, and it passes on HEAD.
    - 'My scan, by key term: Messenger → 메신저 18/18, Browser → 브라우저 28/28, QA Notes
      → QA 노트 21/21, Case File → 사건 파일 19/19, Evidence → 증거 23/24 (the last is a placeholder),
      clue → 단서 26/26. No ko value still contains ''Ticket''.'
    - 'Caveats: the test is a deny list only, and Note and record share 기록 (major
      and minor findings).'
  specs_point_to_replacing_decisions:
    status: pass
    evidence:
    - The notes in domain-model.md (DEC-010, DEC-016), system-design.md (DEC-007,
      DEC-008), qa-core-loop.md (DEC-009, DEC-010, DEC-015), mvp-scope.md (DEC-008,
      DEC-010, DEC-016), and first-playable-flow.md (DEC-010, DEC-015) all cite decision
      files that exist and that replaced the rule named. game_state.gd keeps career
      with no xp or reputation fields, and test_shoply_never_branches_on_a_ticket
      exists.
    - 'Gaps: the qa-core-loop note overgeneralises, and foundation-task.md and 00-initial-plan.md
      carry no pointer (minor finding).'
  removed_strings_unused:
    status: pass
    evidence:
    - 'git show 7616050 -- godot/i18n/ko.json: 26 keys removed and 3 values changed.
      Searching every removed key, raw and JSON-escaped, across godot/scripts, scenes,
      data, and project.godot at e56131e gives 0 hits each. Distinctive parts (''Tracker'',
      ''Create report'', ''Report guide'', ''Bug report'', ''waiting in'', ''Test
      Workspace'') also give 0 hits. The only ''QA Tracker'' left is the deny list
      in test_workstation.gd.'
    - Kit.t(text) is TranslationServer.translate(text), and Kit.tf translates the
      template and then applies %, so runtime keys are literal templates. No dynamic
      source (APP_TITLES, STATUS_LABELS, Report and Note templates) builds a removed
      key.
    - 'Note: about 292 other ko keys are also not referenced literally (old Capture,
      Flag, XP, Reputation strings). They are harmless dead entries; the commit''s
      cleanup is partial.'
