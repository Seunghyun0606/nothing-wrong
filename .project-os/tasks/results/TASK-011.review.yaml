reviewed_commit: b3a7bef
residual_risk: The generic Mutation test proves each Mutation's condition logic, but
  not boundary values or that each condition field is ever filled by the real qa_context.
  A typo'd field or an off-by-one comparison could make a Mutation dead or wrong in
  the game while the test passes; test_full_story only partly covers this. The boundary
  test depends on a hard-coded file list and could pass vacuously if a file is moved.
  The working tree holds uncommitted TASK-012-style changes, so later verification
  should pin to a commit. The M2 Human Gate closure relies on owner direction recorded
  by an agent (DEC-016). The owner should confirm it, though TASK-010 correctly stays
  an unapproved Human Gate in M4.
