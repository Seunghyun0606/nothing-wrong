    status: pass
    evidence:
    - 'Export of HEAD (git archive e56131e, templates copied into a redirected APPDATA):
      exit 0, NothingWrong.exe 110,065,256 bytes. The savepack includes data/canon,
      horizon, intranet, key_terms, people, scenarios, and shoply .json, i18n/ko.json,
      and scripts/autoload/self_check.gdc, with no tests/.'
    - 'Preset unchanged since the first review: no credentials, codesign off, and
      build/ and .godot/ ignored.'
  exported_game_loads_all_content_without_script_error:
    status: pass
    evidence:
    - 'Clean release build: ''Self-check passed: {chapters:10, people:8, records:25,
      tickets:42, views:30}'', exit 0, 1.1 s, empty stderr.'
    - 'shoply.json excluded: exit 1, ''- missing res://data/shoply.json''.'
    - 'Parse error in title_screen.gd: exit 1, ''- the main scene has no script''.'
    - 'Parse error in game_session.gd: crash, exit -1073741819 (nonzero).'
    - 'Gaps (minor findings): a runtime error in lock_screen.gd passes on the release
      build (exit 0) but fails in the editor and on a debug export (exit 1). A push_error
      during startup passes. A parse error in self_check.gd exits 0 with no Self-check
      line.'
  export_command_documented:
    status: pass
    evidence:
    - godot/README.md '## Build' gives the --export-release command and `--headless
      --quit-after 3000 -- --self-check`, and explains that only a 'Self-check passed'
      line with exit 0 is a pass.
    - docs/development/TESTING.md gate table has the Build and Build content rows
      with the same commands.
    - 'Caveat: the PowerShell `&` form does not give an exit code for the GUI exe
      (minor finding).'
verification:
  export_release_headless:
    status: pass
    command: Godot_v4.7.2-stable_win64_console.exe --headless --path <scratch>/h/godot
      --export-release "Windows Desktop" <scratch>\exh\NothingWrong.exe
    result: exit 0
  exported_self_check:
    status: pass
    command: Start-Process exh\NothingWrong.exe -ArgumentList '--headless','--quit-after','3000','--','--self-check'
      -Wait -PassThru (APPDATA with planted saves)
    result: exit 0, 'Self-check passed', planted saves untouched (mtime 2020-01-01),
      no user://tests files left
  fault_missing_shoply:
    status: pass
    command: exclude_filter="tests/*, data/shoply.json", release export, self-check
    result: exit 1
  fault_parse_error_title_screen:
    status: pass
    command: '''func broken(:'' appended to scripts/ui/title_screen.gd, release export,
      self-check'
    result: exit 1, 'the main scene has no script'
  fault_parse_error_autoload:
    status: pass
    command: '''func broken(:'' appended to scripts/autoload/game_session.gd, release
      export, self-check'
    result: crash, exit -1073741819, no passed line
  fault_parse_error_self_check:
    status: fail
    command: '''func broken(:'' appended to scripts/autoload/self_check.gd, release
      export, self-check'
    result: exit 0 after about 21 s (--quit-after), no Self-check line. Only the documented
      'no line means failure' rule catches it.
  fault_runtime_error_release:
    status: fail
    command: null call added in lock_screen.gd _ready, release export, self-check
    result: '''Self-check passed'', exit 0'
  fault_runtime_error_editor_and_debug:
    status: pass
    command: 'Same copy: editor `--headless --path <copy> --quit-after 3000 -- --self-check`,
      and an --export-debug build'
    result: exit 1 in both runs, with the error named
  fault_startup_push_error:
    status: fail
    command: push_error('boom at startup') in DesktopSession._ready, release export,
      self-check
    result: ERROR printed, but 'Self-check passed', exit 0
  documented_powershell_invocation:
    status: fail
    command: '& NothingWrong.exe --headless --quit-after 3000 -- --self-check; $LASTEXITCODE'
    result: $LASTEXITCODE unchanged (sentinel 12345) for a failing build. With `|
      Out-String` it is 1 for a failing build and 0 for a good one.
reviewed_commit: e56131e2aad24527b7de98f818615c0f4de5ed4b
residual_risk: 'The release-build gate proves the packaging: content is present and
  parseable, the main scene and its preload chain compile, and every screen opens.
  It does not see GDScript runtime errors, which release templates do not report,
  or errors logged before the check starts. Those rely on the editor suite and an
  editor or debug self-check. A gate that reads only exit codes must also require
  the ''Self-check passed'' line and capture the exit code correctly for the GUI-subsystem
  exe. The exe has not been launched with a window (rendering and IME) as part of
  the gate.'
