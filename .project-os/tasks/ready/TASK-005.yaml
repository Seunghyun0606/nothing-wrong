id: TASK-005
title: Complete the T01 report, review, and progression pipeline
role: developer
milestone: M1
priority: P0
status: ready

objective: >-
  Add the T01 Scenario and visual Mutation, then complete Report submission,
  deterministic Review, progression, Ticket resolution, and refresh-safe Dashboard return.
why: >-
  M1 is valuable only when the full Scenario-to-Progression pipeline works as a coherent
  playable loop rather than isolated screens.

scope:
  include:
    - Define and validate T01 Ticket, ExpectedBug, scoring, reward, and WRONG_STYLE Mutation data.
    - Apply the Mutation to checkout.confirmButton through the generic resolver.
    - Implement the T01 Report builder with title, reproduction, expected, actual, severity, and evidence.
    - Implement pure structural Review matching and the T01 score/feedback presentation.
    - Update XP, Reputation, Ticket status, histories, unlock state, and persisted Game State atomically.
    - Return the player to Dashboard with resolved T01 state after Review.
  exclude:
    - T02 through T08 content or Account Switcher.
    - LLM/NLP report evaluation.
    - Final Mystery Narrative behavior.
    - Changes to Shoply business rules for the purpose of creating T01.

depends_on:
  - TASK-004
specs:
  - specs/feature/qa-core-loop.md
  - specs/feature/ticket-catalog.md
  - specs/ux/first-playable-flow.md
  - specs/architecture/domain-model.md
  - specs/feature/foundation-task.md
relevant_files:
  - src/scenarios/shoply
  - src/game/mutations
  - src/game/reporting
  - src/game/progression
  - src/persistence
  - src/pages
active_decisions:
  - .project-os/decisions/DEC-001-scenario-driven-architecture.yaml
  - .project-os/decisions/DEC-003-versioned-local-persistence.yaml
  - .project-os/decisions/DEC-004-deterministic-review.yaml

acceptance:
  - With T01 active, checkout.confirmButton renders as Secondary through WRONG_STYLE Mutation data.
  - With the Mutation removed or inactive, the same Shoply component renders the normal Primary CTA.
  - A Report cannot claim Evidence that was not captured for the current Ticket.
  - Review returns deterministic validity, scores, reward deltas, and feedback without React dependencies.
  - A valid T01 Report resolves the Ticket and updates XP and Reputation exactly once.
  - Refresh after completion preserves the resolved Dashboard state.

verification:
  - Run unit tests for T01 Scenario validation, Mutation active/inactive behavior, Review score, progression, and serialization.
  - Run component tests for Report Builder and Review Result.
  - Run typecheck and production build.
  - Verify changing the T01 Mutation payload changes output without editing Shoply components.

human_gate: false
risk: high
references:
  - specs/feature/foundation-task.md#10-t01-scenario
  - specs/feature/foundation-task.md#14-report
  - specs/feature/foundation-task.md#15-review
  - specs/feature/foundation-task.md#16-progress-update
