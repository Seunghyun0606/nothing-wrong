id: TASK-010
title: Run the full-game human playtest gate
role: developer
milestone: M4
priority: P0
status: ready

objective: >-
  Conduct the documented human playtest on the Godot build of the whole game and record
  a human decision on whether it is an MVP candidate.
why: >-
  Enjoyment, believability, and whether the deductions feel fair are subjective; DEC-016
  moved this gate from M2 to the end of M4 so it tests the game that ships.

scope:
  include:
    - Prepare the session from the updated playtest kit (TASK-015).
    - Run at least one session from a fresh save and answer the six playtest questions.
    - Record defects, observations, and an explicit human recommendation.
  exclude:
    - Implicit product-direction or architecture changes based on playtest findings.
    - Production release or publishing a build.

depends_on:
  - TASK-012
  - TASK-013
  - TASK-014
  - TASK-015
  - TASK-016
  - TASK-017
  - TASK-018
  - TASK-019
specs:
  - specs/ux/first-playable-flow.md
  - docs/playtest/TASK-010-participant-guide.md
  - docs/playtest/TASK-010-session-template.md
relevant_files:
  - docs/playtest
active_decisions:
  - .project-os/decisions/DEC-016-milestone-rebaseline.yaml

acceptance:
  - The six playtest questions have recorded human observations.
  - Defects found are filed or fixed through their own tasks.
  - A human explicitly decides whether the build is an MVP candidate.

verification:
  - Record the human playtest session and final decision without self-approval.

human_gate: true
risk: high
