id: TASK-011
title: Verify the shipped Ticket set as the MVP content
role: developer
milestone: M3
priority: P0
status: ready

objective: >-
  Prove with automated checks that the shipped T01–T42 Ticket set covers the planned MVP
  mechanics, and make the catalog describe what ships.
why: >-
  M3 was written for a T05–T08 plan the story replaced (DEC-016); the shipped set needs
  the same coverage guarantees the catalog's verification rules ask for.

scope:
  include:
    - Map No Bug, Cross Screen, Multiple Bugs, and Mini Regression to the Tickets that carry them.
    - Check every Mutation is active only when all of its conditions hold.
    - Check every Mutation target is read by Shoply and Shoply never names a Ticket.
    - Confirm the full-story UI flow plays every Ticket and the Final.
    - Update specs/feature/ticket-catalog.md.
  exclude:
    - New Tickets or story content.
    - Career titles, XP, or Reputation (removed by DEC-010).

depends_on:
  - TASK-009
specs:
  - specs/feature/ticket-catalog.md
relevant_files:
  - godot/data/scenarios.json
  - godot/tests/test_domain.gd
  - godot/tests/test_ui_flow.gd
active_decisions:
  - .project-os/decisions/DEC-010-notes-and-messenger-reporting.yaml
  - .project-os/decisions/DEC-016-milestone-rebaseline.yaml

acceptance:
  - Each planned mechanic names its Tickets in the catalog and is exercised by a test.
  - Every Mutation is checked active under its conditions and inactive when each one fails.
  - Shoply code has no Ticket, Scenario, Bug, or Mutation identifier.
  - The full Godot suite passes.

verification:
  - Run the headless Godot suite.
  - Run projectctl doctor.

human_gate: false
risk: low
